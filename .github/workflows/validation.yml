name: Validate plugin

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Unit and integration tests
        run: npm test
      - name: Validators (syntax, topics, schemas, agent lint, settings and hooks)
        run: npm run validate
      - name: Encoding hygiene (copy-paste-safe ASCII typography)
        run: npm run hygiene:encoding
      - name: Secret scan (built-in patterns)
        run: npm run security:secrets
      - name: Plugin layout
        run: |
          test -f .claude-plugin/plugin.json
          test -f .claude-plugin/marketplace.json
          test -f hooks/hooks.json
          node -e 'const p=require("./.claude-plugin/plugin.json"),m=require("./.claude-plugin/marketplace.json");if(!m.plugins.some(x=>x.name===p.name&&x.source==="./"))process.exit(1)'
