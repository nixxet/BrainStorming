name: Mirror Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify mirror has no pipeline copy
        run: |
          test ! -d .claude/agents
          test ! -d .claude/skills
          test ! -d scripts
          test ! -d test
          test -f index.md
          test -f CLAUDE.md